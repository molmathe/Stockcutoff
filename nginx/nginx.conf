events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # checkin.fonneygroup.com — the FonneyGroup timesheet app, a separate container
    # on proxy_network. It reaches this nginx through the same tunnel as the POS,
    # so without this block the default server below answered it with the POS app.
    #
    # This lives here rather than being edited on the host because the deploy job
    # copies nginx/nginx.conf from the repository over the host's copy on every
    # run, which is how the previous hand-written block was lost.
    server {
        listen 80;
        server_name checkin.fonneygroup.com;

        location / {
            # Resolved per request (see the resolver above) so nginx still starts
            # when the timesheet container is down.
            set $timesheet_upstream http://timesheet:8787;
            proxy_pass $timesheet_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        # `server_name _` matches no real Host header — this block only ever
        # received POS traffic because it was the sole server block, and so the
        # default. Marking it explicitly keeps that true now another block exists.
        listen 80 default_server;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self';" always;

        # API
        location /api/ {
            set $backend_upstream http://backend:3001;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 40s;
        }

        # Uploaded files
        location /uploads/ {
            set $backend_upstream http://backend:3001;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            set $backend_upstream http://backend:3001;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        # Frontend (SPA)
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
