name: Read backend logs

# Manual, read-only diagnostics. The deployment host is a self-hosted runner with
# no other shell access from outside, so this is the way to inspect what the
# running backend is actually seeing.
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: 'grep pattern to filter log lines'
        required: true
        default: 'client-ip'
      lines:
        description: 'how many recent log lines to search'
        required: false
        default: '500'

jobs:
  logs:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - uat
      - stockcutoff
    steps:
      - name: Show what is actually running
        run: |
          set -euo pipefail
          echo "=== running image ==="
          docker inspect stockcutoff-backend --format '{{.Config.Image}}' || true
          echo "=== started at ==="
          docker inspect stockcutoff-backend --format '{{.State.StartedAt}}' || true
          echo "=== IMAGE_TAG the deploy bundle points at ==="
          grep '^IMAGE_TAG=' /opt/stockcutoff-uat/.env || echo '(not set)'

      - name: Show proxy routing state
        run: |
          set -euo pipefail
          echo "=== containers on this host ==="
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "=== server blocks in the deployed nginx.conf ==="
          grep -n 'server_name\|server {\|proxy_pass' /opt/stockcutoff-uat/nginx/nginx.conf || true
          echo "=== does it mention checkin or timesheet? ==="
          grep -n 'checkin\|timesheet\|8787' /opt/stockcutoff-uat/nginx/nginx.conf || echo '(no reference)'
          echo "=== nginx.conf last modified ==="
          stat -c '%y' /opt/stockcutoff-uat/nginx/nginx.conf || true
          echo "=== proxy_network members ==="
          docker network inspect proxy_network --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null || echo '(no proxy_network)'

      - name: Show matching backend log lines
        env:
          PATTERN: ${{ inputs.pattern }}
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          echo "=== matches for '$PATTERN' in the last $LINES lines ==="
          docker logs stockcutoff-backend --tail "$LINES" 2>&1 | grep -F -- "$PATTERN" | tail -40 || echo "(no matching lines)"
